  .qxq-wrap {
    background: #F6F7F8; border: 1px solid #C6CCD2;
    border-radius: 3px; padding: 18px 20px; margin: 32px 0 0;
  }
  .qxq-label {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: #5C6872; margin: 0 0 18px;
  }
  .qxq-item { margin: 0 0 26px; }
  .qxq-item:last-child { margin-bottom: 0; }

  }

  .qxq-opt:disabled { cursor: default; }
  .qxq-opt.qxq-right { background: #EBF4EE; border-color: #2A6B3A; color: #1A4A28; }
  .qxq-opt.qxq-wrong { background: #F6EFF3; border-color: #8A4262; color: #5A2040; }
  .qxq-fb {

    font-size: 13.5px; line-height: 1.55; margin: 7px 0 0;
    padding: 8px 11px; border-radius: 2px;
  }

        .qx-root {
          --paper: #E6E8EB;
          --panel: #F6F7F8;
          --plot: #FCFCFC;
          --ink: #161B22;
          --muted: #5C6872;
          --rule: #C6CCD2;
          --data: #2A4C6B;
          --data-soft: #8FA6B8;
          --accent: #8A4262;
          background: var(--paper);
          color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px;
          min-height: 100%;
          box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
          color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 14ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p {
          font-size: 18px; line-height: 1.66; margin: 0 0 18px;
          max-width: 62ch; color: #222A31;
        }
        .qx-p.lead { font-size: 19.5px; }

        .qx-panel {
          background: var(--panel);
          border: 1px solid var(--rule);
          border-radius: 3px;
          padding: 22px 22px 18px;
          margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          font-variant-numeric: tabular-nums;
        }
        .qx-bar-row {
          display: flex; align-items: baseline; justify-content: space-between;
          gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
        }
        .qx-tally { font-size: 14px; color: var(--muted); }
        .qx-tally strong { color: var(--ink); font-weight: 600; font-size: 15px; }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; }
        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.45; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.quiet { background: transparent; color: var(--muted); }

        .qx-plotwrap {
          background: var(--plot); border: 1px solid var(--rule);
          border-radius: 2px; margin: 4px 0 14px; padding: 4px 0 0;
        }
        .qx-svg { display: block; width: 100%; height: auto; }
        .qx-empty {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px; fill: var(--muted);
        }
        .qx-note {
          font-size: 14px; line-height: 1.5; color: var(--muted);
          margin: 0; max-width: 60ch;
        }
        .qx-note b { color: var(--ink); font-weight: 600; }

        .qx-table { width: 100%; border-collapse: collapse; margin: 16px 0 4px; font-size: 14px; }
        .qx-table th {
          text-align: right; font-weight: 500; color: var(--muted);
          padding: 6px 8px; border-bottom: 1px solid var(--rule); font-size: 13px;
        }
        .qx-table th:first-child, .qx-table td:first-child { text-align: left; }
        .qx-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #E4E8EB; }
        .qx-table tr:last-child td { border-bottom: none; }
        .qx-truth { color: var(--accent); }

        .qx-scale { margin: 18px 0 6px; font-size: 15px; }
        .qx-scale td { padding: 5px 14px 5px 0; }
        .qx-scale td:first-child { color: var(--muted); }

        .qx-rule { border: none; border-top: 1px solid var(--rule); margin: 40px 0 0; }
        .qx-footer { font-size: 15px; color: var(--muted); margin: 18px 0 0; }

        @media (max-width: 560px) {
          .qx-h1 { font-size: 31px; max-width: 18ch; }
          .qx-p { font-size: 17px; }
          .qx-panel { padding: 16px 14px 14px; }
        }

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap');

        .qx-root {
          --paper: #E6E8EB;
          --panel: #F6F7F8;
          --plot: #FCFCFC;
          --ink: #161B22;
          --muted: #5C6872;
          --rule: #C6CCD2;
          --data: #2A4C6B;
          --data-soft: #93A8B8;
          --accent: #8A4262;
          background: var(--paper);
          color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px;
          min-height: 100%;
          box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 15ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p { font-size: 18px; line-height: 1.66; margin: 0 0 18px; max-width: 62ch; color: #222A31; }
        .qx-p.lead { font-size: 19.5px; }
        .qx-p b { font-weight: 600; }

        .qx-panel {
          background: var(--panel); border: 1px solid var(--rule);
          border-radius: 3px; padding: 22px; margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          font-variant-numeric: tabular-nums;
        }
        .qx-split { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
        .qx-col { flex: 1 1 280px; min-width: 260px; }
        .qx-framed { background: var(--plot); border: 1px solid var(--rule); border-radius: 2px; }
        .qx-svg { display: block; width: 100%; height: auto; touch-action: none; }
        .qx-svg.grab { cursor: grab; }
        .qx-svg.grab:active { cursor: grabbing; }

        .qx-num { display: flex; justify-content: space-between; align-items: baseline;
          padding: 6px 0; border-bottom: 1px solid #E1E6EA; font-size: 15px; }
        .qx-num span:first-child { color: var(--muted); font-size: 14px; }
        .qx-num span:last-child { font-weight: 500; }

        .qx-result {
          border: 1px solid var(--rule); background: #FFFFFF; border-radius: 2px;
          padding: 12px 14px; margin: 14px 0; min-height: 58px;
        }
        .qx-result .big { font-size: 30px; font-weight: 600; line-height: 1.1; }
        .qx-result .sub { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
        .qx-result .waiting { font-size: 15px; color: var(--muted); }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.45; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.primary { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.primary:hover:not(:disabled) { color: #FFFFFF; opacity: 0.9; }
        .qx-btn.quiet { background: transparent; color: var(--muted); }
        .qx-seglabel { font-size: 13px; color: var(--muted); width: 100%; margin: 14px 0 -4px; }

        .qx-note { font-size: 13.5px; line-height: 1.5; color: var(--muted); margin: 12px 0 0; }
        .qx-note b { color: var(--ink); font-weight: 600; }
        .qx-flag { font-size: 13.5px; line-height: 1.5; color: var(--accent); margin: 12px 0 0; }

        .qx-aside {
          border-left: 2px solid var(--rule); padding: 2px 0 2px 18px;
          margin: 30px 0; max-width: 60ch;
        }
        .qx-aside p { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 0 10px; }
        .qx-aside p:last-child { margin-bottom: 0; }

        .qx-table { width: 100%; border-collapse: collapse; margin: 16px 0 18px; font-size: 15px; }
        .qx-table td { padding: 5px 14px 5px 0; }
        .qx-table td:first-child { color: var(--muted); width: 13em; }

        .qx-rule { border: none; border-top: 1px solid var(--rule); margin: 40px 0 0; }
        .qx-footer { font-size: 15px; color: var(--muted); margin: 18px 0 0; }

        @media (max-width: 560px) {
          .qx-h1 { font-size: 31px; max-width: 18ch; }
          .qx-p { font-size: 17px; }

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap');

        .qx-root {
          --paper: #E6E8EB; --panel: #F6F7F8; --plot: #FCFCFC;
          --ink: #161B22; --muted: #5C6872; --rule: #C6CCD2;
          --data: #2A4C6B; --data-soft: #93A8B8; --accent: #8A4262;
          background: var(--paper); color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px; min-height: 100%; box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 16ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p { font-size: 18px; line-height: 1.66; margin: 0 0 18px; max-width: 62ch; color: #222A31; }
        .qx-p.lead { font-size: 19.5px; }
        .qx-p b { font-weight: 600; }

        .qx-panel {
          background: var(--panel); border: 1px solid var(--rule);
          border-radius: 3px; padding: 20px 22px 18px; margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
        }

        .qx-phase {
          font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
          text-transform: uppercase; color: var(--muted); margin: 0 0 16px;
        }
        .qx-phase.after { color: var(--accent); }

        .qx-two-col {
          display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
        }
        .qx-state-col {
          flex: 1 1 220px; min-width: 200px;
        }
        .qx-state-label {
          font-size: 13px; font-weight: 600; color: var(--muted);
          margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .qx-framed {
          background: var(--plot); border: 1px solid var(--rule); border-radius: 2px;
        }

        .qx-num {
          display: flex; justify-content: space-between; align-items: baseline;
          padding: 5px 0; border-bottom: 1px solid #E1E6EA; font-size: 14px;
        }
        .qx-num:last-child { border-bottom: none; }
        .qx-num span:first-child { color: var(--muted); font-size: 13px; }
        .qx-num span:last-child { font-weight: 500; }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; }
        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.45; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.accent { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.accent:hover:not(:disabled) { background: #1e374f; border-color: #1e374f; color: #FFFFFF; }
        .qx-btn.quiet { background: transparent; color: var(--muted); }

        .qx-divider {
          border: none; border-top: 1px solid var(--rule); margin: 18px 0;
        }
        .qx-apply-row {
          display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;
        }
        .qx-apply-note {
          font-size: 14px; line-height: 1.5; color: var(--muted);
          margin: 0; flex: 1 1 200px; max-width: 50ch;
        }
        .qx-apply-note b { color: var(--ink); font-weight: 600; }
        .qx-apply-note.revealed { color: var(--accent); }

        .qx-calc {
          background: #FFFFFF; border: 1px solid var(--rule); border-radius: 2px;
          padding: 14px 16px; margin: 18px 0; max-width: 62ch;
        }
        .qx-calc-label {
          font-size: 13px; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 10px;
        }
        .qx-calc-row {
          font-size: 14.5px; line-height: 1.6; margin: 0 0 4px;
          font-variant-numeric: tabular-nums;
        }
        .qx-calc-row:last-child { margin-bottom: 0; }
        .qx-calc-row b { font-weight: 600; color: var(--ink); }
        .qx-calc-row .dim { color: var(--muted); }

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap');

        .qx-root {
          --paper: #E6E8EB; --panel: #F6F7F8; --plot: #FCFCFC;
          --ink: #161B22; --muted: #5C6872; --rule: #C6CCD2;
          --data: #2A4C6B; --data-soft: #93A8B8; --accent: #8A4262;
          background: var(--paper); color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px; min-height: 100%; box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 16ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p { font-size: 18px; line-height: 1.66; margin: 0 0 18px; max-width: 62ch; color: #222A31; }
        .qx-p.lead { font-size: 19.5px; }
        .qx-p b { font-weight: 600; }

        .qx-panel {
          background: var(--panel); border: 1px solid var(--rule);
          border-radius: 3px; padding: 20px 22px 18px; margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
        }

        .qx-two-col {
          display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
        }
        .qx-circle-col { flex: 0 0 180px; min-width: 140px; }
        .qx-controls-col { flex: 1 1 220px; min-width: 200px; display: flex; flex-direction: column; gap: 14px; }

        .qx-num {
          display: flex; justify-content: space-between; align-items: baseline;
          padding: 5px 0; border-bottom: 1px solid #E1E6EA; font-size: 14px;
        }
        .qx-num:last-child { border-bottom: none; }
        .qx-num span:first-child { color: var(--muted); font-size: 13px; }

        .qx-gate-section { display: flex; flex-direction: column; gap: 8px; }
        .qx-gate-section-label {
          font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
          text-transform: uppercase; color: var(--muted);
        }

        .qx-rot-row { display: flex; align-items: center; gap: 10px; }
        .qx-rot-val {
          font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums;
          min-width: 56px; color: var(--data); text-align: right;
        }
        .qx-rot-slider {
          flex: 1; height: 4px; accent-color: var(--data); cursor: pointer;
        }
        .qx-presets { display: flex; flex-wrap: wrap; gap: 5px; }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; }
        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.4; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.accent { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.accent:hover:not(:disabled) { background: #1e374f; }
        .qx-btn.quiet { background: transparent; color: var(--muted); }
        .qx-btn.sm { font-size: 12.5px; padding: 5px 9px; }

        .qx-divider { border: none; border-top: 1px solid var(--rule); margin: 4px 0; }

        .qx-trail {
          display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
          padding: 12px 0 0; font-size: 12.5px; min-height: 32px;
        }
        .qx-trail-badge {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          background: #FFFFFF; border: 1px solid var(--rule);
          border-radius: 2px; padding: 2px 7px;
          font-size: 12px; color: var(--ink);
        }
        .qx-trail-badge.start { background: transparent; border-color: transparent; color: var(--muted); }
        .qx-trail-badge.now { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
        .qx-trail-sep { color: var(--rule); font-size: 11px; }

        .qx-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
        .qx-table th {
          text-align: left; font-weight: 600; color: var(--muted);
          padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); font-size: 13px;
        }
        .qx-table td { padding: 6px 8px 6px 0; border-bottom: 1px solid #E4E8EB; }
        .qx-table tr:last-child td { border-bottom: none; }
        .qx-table .note { color: var(--muted); font-size: 12.5px; }

        .qx-aside {
          border-left: 2px solid var(--rule); padding: 2px 0 2px 18px;
          margin: 30px 0; max-width: 60ch;
        }

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap');

        .qx-root {
          --paper: #E6E8EB; --panel: #F6F7F8; --plot: #FCFCFC;
          --ink: #161B22; --muted: #5C6872; --rule: #C6CCD2;
          --data: #2A4C6B; --data-soft: #93A8B8; --accent: #8A4262;
          background: var(--paper); color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px; min-height: 100%; box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 16ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p { font-size: 18px; line-height: 1.66; margin: 0 0 18px; max-width: 62ch; color: #222A31; }
        .qx-p.lead { font-size: 19.5px; }
        .qx-p b { font-weight: 600; }

        .qx-panel {
          background: var(--panel); border: 1px solid var(--rule);
          border-radius: 3px; padding: 20px 22px 18px; margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
        }

        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.4; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.accent { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.accent:hover:not(:disabled) { background: #1e374f; }
        .qx-btn.quiet { background: transparent; color: var(--muted); }
        .qx-btn.predict-opt {
          width: 100%; text-align: left; padding: 10px 14px;
          font-size: 15px; margin-bottom: 6px; line-height: 1.4;
        }
        .qx-btn.predict-opt.correct { border-color: #2A6B3A; color: #1A4A28; background: #EFF7F1; }
        .qx-btn.predict-opt.wrong { border-color: var(--accent); color: #5C1E36; background: #F8EFF3; }

        .qx-state-row {
          display: flex; align-items: center; gap: 16px;
          padding: 14px 0; flex-wrap: wrap;
        }
        .qx-state-box {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          background: #FFFFFF; border: 1px solid var(--rule);
          border-radius: 2px; padding: 10px 14px; font-size: 14px;
          line-height: 1.7;
        }
        .qx-state-box .label {
          font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
          text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
        }
        .qx-state-box .amp0 { color: var(--data); font-weight: 500; }
        .qx-state-box .amp1 { color: var(--muted); font-weight: 500; }
        .qx-arrow {
          font-size: 22px; color: var(--muted); flex-shrink: 0;
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
        }
        .qx-gate-badge {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 600;
          background: var(--data); color: #FFF;
          border-radius: 2px; padding: 3px 8px;
        }
        .qx-gate-badge.ghost {
          background: transparent; border: 1px dashed var(--rule);
          color: var(--muted);
        }

        .qx-panel-label {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
          text-transform: uppercase; color: var(--muted); margin: 0 0 14px;
        }
        .qx-predict-prompt {
          font-size: 16px; line-height: 1.5; margin: 0 0 16px; color: var(--ink);
          font-family: 'Newsreader', Georgia, serif;
        }

        /* Path diagram */
        .qx-path-diagram {
          display: grid;
          grid-template-columns: auto 1fr auto;
          gap: 0 8px;
          align-items: center;
          margin: 16px 0 8px;
        }
        .qx-path-col-label {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
          text-transform: uppercase; color: var(--muted);
          padding-bottom: 8px; text-align: center;
        }
        .qx-sources {
          display: flex; flex-direction: column; gap: 28px;
          padding: 12px 0;
        }
        .qx-dests {
          display: flex; flex-direction: column; gap: 28px;
          padding: 12px 0;
        }
        .qx-source-node, .qx-dest-node {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 13.5px; font-weight: 500;
          background: #FFFFFF; border: 1px solid var(--rule);
          border-radius: 2px; padding: 6px 10px; white-space: nowrap;
        }
        .qx-source-node .val { color: var(--data); }
        .qx-source-node .val.neg { color: var(--accent); }
        .qx-dest-node .sum { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .qx-dest-node .total { color: var(--data); font-weight: 600; }
        .qx-dest-node .total.zero { color: var(--muted); }
        .qx-dest-node .total.neg { color: var(--accent); }

        .qx-path-label {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 12px; fill: var(--muted);
        }

        .qx-result-note {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; color: var(--muted);
          margin: 4px 0 0;
        }
        .qx-result-note.certain { color: #1A4A28; font-weight: 500; }
        .qx-result-note.impossible { color: var(--muted); }

        .qx-feedback-box {
          border-left: 3px solid;
          padding: 10px 14px; margin: 16px 0 4px;
          font-size: 15px; line-height: 1.55;
          font-family: 'Newsreader', Georgia, serif;
        }
        .qx-feedback-box.right { border-color: #2A6B3A; background: #EFF7F1; color: #1A4A28; }
        .qx-feedback-box.wrong { border-color: var(--accent); background: #F8EFF3; color: #5C1E36; }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; }

        .qx-aside {
          border-left: 2px solid var(--rule); padding: 2px 0 2px 18px;
          margin: 30px 0; max-width: 60ch;
        }
        .qx-aside p { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 0 10px; }
        .qx-aside p:last-child { margin-bottom: 0; }

        .qx-rule { border: none; border-top: 1px solid var(--rule); margin: 40px 0 0; }
        .qx-footer { font-size: 15px; color: var(--muted); margin: 18px 0 0; }

        @media (max-width: 560px) {
          .qx-h1 { font-size: 31px; max-width: 18ch; }
          .qx-p { font-size: 17px; }
          .qx-panel { padding: 16px 14px 14px; }

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap');

        .qx-root {
          --paper: #E6E8EB; --panel: #F6F7F8; --plot: #FCFCFC;
          --ink: #161B22; --muted: #5C6872; --rule: #C6CCD2;
          --data: #2A4C6B; --data-soft: #93A8B8; --accent: #8A4262;
          background: var(--paper); color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px; min-height: 100%; box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 16ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p { font-size: 18px; line-height: 1.66; margin: 0 0 18px; max-width: 62ch; color: #222A31; }
        .qx-p.lead { font-size: 19.5px; }
        .qx-p b { font-weight: 600; }

        .qx-panel {
          background: var(--panel); border: 1px solid var(--rule);
          border-radius: 3px; padding: 20px 22px 18px; margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
        }

        .qx-panel-label {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
          text-transform: uppercase; color: var(--muted); margin: 0 0 12px;
        }

        /* Wire */
        .qx-wire-row {
          display: flex; align-items: center; gap: 0;
          padding: 8px 0 16px; overflow-x: auto;
        }
        .qx-wire-end {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 14px; font-weight: 500; color: var(--muted);
          white-space: nowrap; flex-shrink: 0;
        }
        .qx-wire-seg {
          flex: 1; min-width: 12px; height: 2px; background: var(--rule);
          flex-shrink: 0; align-self: center;
        }
        .qx-wire-seg.short { min-width: 8px; max-width: 24px; }
        .qx-gate-slot {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 600;
          width: 48px; height: 34px; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
          border-radius: 2px; position: relative;
        }
        .qx-gate-slot.filled {
          background: var(--data); color: #FFF;
          border: 1px solid var(--data); cursor: pointer;
        }
        .qx-gate-slot.filled:hover { background: #1e374f; }
        .qx-gate-slot.filled:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-gate-slot.empty {
          background: transparent; color: var(--rule);
          border: 1.5px dashed var(--rule);
        }
        .qx-measure-box {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 600; color: var(--accent);
          width: 34px; height: 34px; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
          border: 1.5px solid var(--accent); border-radius: 2px;
        }
        .qx-remove-hint {
          font-size: 9px; font-weight: 400; font-family: 'IBM Plex Sans', sans-serif;
          position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
          color: var(--muted); white-space: nowrap; opacity: 0;
          pointer-events: none;
        }
        .qx-gate-slot.filled:hover .qx-remove-hint { opacity: 1; }

        /* Palette */
        .qx-palette { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }

        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.4; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.accent { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.accent:hover:not(:disabled) { background: #1e374f; }
        .qx-btn.quiet { background: transparent; color: var(--muted); }
        .qx-btn.sm { font-size: 13px; padding: 6px 11px; }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .qx-divider { border: none; border-top: 1px solid var(--rule); margin: 16px 0; }

        /* State readout */
        .qx-state-row {
          display: flex; gap: 20px; flex-wrap: wrap;
        }
        .qx-state-cell {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 13.5px; line-height: 1.6;
        }
        .qx-state-cell .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
        .qx-state-cell .val { font-weight: 500; }
        .qx-state-cell .val.c0 { color: var(--data); }
        .qx-state-cell .val.c1 { color: var(--muted); }

        /* Histogram */
        .qx-histo-wrap {
          background: var(--plot); border: 1px solid var(--rule);
          border-radius: 2px; padding: 16px 16px 10px;
          margin: 0;
        }
        .qx-histo {
          display: flex; gap: 28px; align-items: flex-end;
          height: ${q+30}px; padding-bottom: 0;
        }
        .qx-bar-col {
          display: flex; flex-direction: column; align-items: center; gap: 3px;
          flex: 0 0 56px;
        }
        .qx-bar-pct {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 13px; font-weight: 600; color: var(--ink);
          min-height: 18px;
        }
        .qx-bar {
          width: 56px; border-radius: 1px 1px 0 0;
          transition: height 0.2s ease;
        }
        .qx-bar.r0 { background: var(--data); }
        .qx-bar.r1 { background: var(--data-soft); }
        .qx-bar-baseline { width: 100%; height: 1px; background: var(--ink); margin-top: 0; }
        .qx-bar-lbl {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 12px; color: var(--muted); margin-top: 5px;
        }
        .qx-histo-empty {
          display: flex; align-items: center; justify-content: center;
          height: ${q+30}px;
          color: var(--muted);
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px;
        }
        .qx-shot-count {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 12px; color: var(--muted);
          text-align: right; margin-top: 8px;
        }

        .qx-aside {
          border-left: 2px solid var(--rule); padding: 2px 0 2px 18px;
          margin: 30px 0; max-width: 60ch;
        }
        .qx-aside p { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 0 10px; }
        .qx-aside p:last-child { margin-bottom: 0; }

        .qx-rule { border: none; border-top: 1px solid var(--rule); margin: 40px 0 0; }
        .qx-footer { font-size: 15px; color: var(--muted); margin: 18px 0 0; }

        @media (max-width: 560px) {
          .qx-h1 { font-size: 31px; max-width: 18ch; }
          .qx-p { font-size: 17px; }
          .qx-panel { padding: 16px 14px 14px; }
        }

        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap');

        .qx-root {
          --paper: #E6E8EB; --panel: #F6F7F8; --plot: #FCFCFC;
          --ink: #161B22; --muted: #5C6872; --rule: #C6CCD2;
          --data: #2A4C6B; --data-soft: #93A8B8; --accent: #8A4262;
          background: var(--paper); color: var(--ink);
          font-family: 'Newsreader', Iowan Old Style, Palatino, Georgia, serif;
          padding: 40px 20px 72px; min-height: 100%; box-sizing: border-box;
        }
        .qx-wrap { max-width: 680px; margin: 0 auto; }

        .qx-eyebrow {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 14px;
        }
        .qx-h1 {
          font-size: 40px; line-height: 1.12; font-weight: 400;
          letter-spacing: -0.012em; margin: 0 0 24px; max-width: 20ch;
        }
        .qx-h2 {
          font-size: 23px; line-height: 1.25; font-weight: 500;
          margin: 44px 0 12px; letter-spacing: -0.006em;
        }
        .qx-p { font-size: 18px; line-height: 1.66; margin: 0 0 18px; max-width: 62ch; color: #222A31; }
        .qx-p.lead { font-size: 19.5px; }
        .qx-p b { font-weight: 600; }

        .qx-panel {
          background: var(--panel); border: 1px solid var(--rule);
          border-radius: 3px; padding: 20px 22px 18px; margin: 28px 0 30px;
        }
        .qx-sans {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
        }
        .qx-panel-label {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
          text-transform: uppercase; color: var(--muted); margin: 0 0 10px;
        }
        .qx-divider { border: none; border-top: 1px solid var(--rule); margin: 16px 0; }

        /* Circuit diagram */
        .qx-circuit {
          display: grid;
          grid-template-columns: auto 1fr auto auto 1fr auto;
          row-gap: 0; column-gap: 0;
          align-items: center;
          margin: 0 0 18px;
        }
        .qx-wire-label {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 13px; font-weight: 500; color: var(--muted);
          padding-right: 6px; white-space: nowrap;
        }
        .qx-wire-line {
          height: 2px; background: var(--rule);
        }
        .qx-circ-gate {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 600;
          width: 40px; height: 30px;
          display: flex; align-items: center; justify-content: center;
          border-radius: 2px; flex-shrink: 0; position: relative; z-index: 1;
        }
        .qx-circ-gate.filled { background: var(--data); color: #FFF; border: 1px solid var(--data); }
        .qx-circ-gate.empty { background: transparent; border: 1.5px dashed var(--rule); color: var(--rule); }
        .qx-circ-gate.measure { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
        .qx-circ-gate.cnot-ctrl {
          background: var(--data); color: #FFF; border: 1px solid var(--data);
          border-radius: 50%; width: 14px; height: 14px; font-size: 0;
        }
        .qx-circ-gate.cnot-tgt {
          border: 2px solid var(--data); border-radius: 50%;
          width: 28px; height: 28px; font-size: 16px; color: var(--data);
          background: transparent;
          display: flex; align-items: center; justify-content: center;
        }
        .qx-cnot-col {
          display: flex; flex-direction: column; align-items: center;
          position: relative; flex-shrink: 0; width: 40px;
        }
        .qx-cnot-col .wire-h {
          width: 100%; height: 2px; background: var(--rule);
        }
        .qx-cnot-col .vert-line {
          width: 2px; background: var(--data);
          position: absolute; top: 50%; left: 50%; transform: translateX(-50%);
        }
        .qx-cnot-inactive {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 11px; color: var(--rule); font-weight: 400;
          width: 40px; text-align: center;
        }

        /* Controls */
        .qx-prep-row {
          display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          margin-bottom: 12px;
        }
        .qx-prep-lbl {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 13px; font-weight: 500; color: var(--muted);
          min-width: 90px; flex-shrink: 0;
        }
        .qx-btn-group { display: flex; gap: 4px; }

        .qx-btn {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
          background: #FFFFFF; color: var(--ink);
          border: 1px solid var(--rule); border-radius: 2px;
          padding: 8px 13px; cursor: pointer;
        }
        .qx-btn:hover:not(:disabled) { border-color: var(--data); color: var(--data); }
        .qx-btn:disabled { opacity: 0.4; cursor: default; }
        .qx-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
        .qx-btn.accent { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.accent:hover:not(:disabled) { background: #1e374f; }
        .qx-btn.active { background: var(--data); border-color: var(--data); color: #FFFFFF; }
        .qx-btn.sm { font-size: 13px; padding: 6px 11px; }
        .qx-btn.toggle-on { background: #2A6B3A; border-color: #2A6B3A; color: #FFF; }
        .qx-btn.toggle-on:hover { background: #1e5029; }

        .qx-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

        /* Truth table */
        .qx-truth {
          display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px;
        }
        .qx-truth-cell {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 13px; background: #FFFFFF; border: 1px solid var(--rule);
          border-radius: 2px; padding: 5px 10px; text-align: center;
          min-width: 52px;
        }
        .qx-truth-cell .ket { color: var(--muted); font-size: 12px; }
        .qx-truth-cell .pct { font-weight: 600; color: var(--data); font-size: 14px; margin-top: 1px; }
        .qx-truth-cell .pct.zero { color: var(--rule); font-weight: 400; }

        /* Histogram */
        .qx-histo-wrap {
          background: var(--plot); border: 1px solid var(--rule);
          border-radius: 2px; padding: 16px 16px 10px;
        }
        .qx-histo { display: flex; gap: 12px; align-items: flex-end; height: 126px; }
        .qx-bar-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
        .qx-bar-pct {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 12px; font-weight: 600; color: var(--ink); min-height: 16px;
        }
        .qx-bar { width: 100%; max-width: 52px; border-radius: 1px 1px 0 0; }
        .qx-bar.r00 { background: var(--data); }
        .qx-bar.r01 { background: #3D6E91; }
        .qx-bar.r10 { background: var(--data-soft); }
        .qx-bar.r11 { background: #7A9BB0; }
        .qx-bar-lbl {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 12px; color: var(--muted); margin-top: 4px; text-align: center;
        }
        .qx-histo-empty {
          display: flex; align-items: center; justify-content: center;
          height: 126px; color: var(--muted);
          font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 14px;
        }
        .qx-shot-count {
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          font-variant-numeric: tabular-nums;
          font-size: 12px; color: var(--muted); text-align: right; margin-top: 8px;
        }

        /* CNOT table */
        .qx-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
        .qx-table th {
          text-align: left; font-weight: 600; color: var(--muted);
          padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); font-size: 13px;
        }
        .qx-table td { padding: 6px 8px 6px 0; border-bottom: 1px solid #E4E8EB; }
        .qx-table tr:last-child td { border-bottom: none; }
        .qx-table .note { color: var(--muted); font-size: 12.5px; }
        .qx-table .fired { color: #1A4A28; font-weight: 600; }
        .qx-table .silent { color: var(--muted); }

        .qx-aside {
          border-left: 2px solid var(--rule); padding: 2px 0 2px 18px;
          margin: 30px 0; max-width: 60ch;
        }
        .qx-aside p { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 0 10px; }
        .qx-aside p:last-child { margin-bottom: 0; }

        .qx-rule { border: none; border-top: 1px solid var(--rule); margin: 40px 0 0; }
        .qx-footer { font-size: 15px; color: var(--muted); margin: 18px 0 0; }

        @media (max-width: 560px) {
          .qx-h1 { font-size: 31px; }
          .qx-p { font-size: 17px; }
